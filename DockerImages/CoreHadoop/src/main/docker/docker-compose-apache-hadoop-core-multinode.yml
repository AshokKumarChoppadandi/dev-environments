networks:
  hadoop_cluster:
    driver: bridge

services:
  namenode:
    image: ashokkumarchoppadandi/apache-hadoop:2.7.6-stream9
    networks:
      - hadoop_cluster
    ports:
      - "50070:50070"
    hostname: namenode
    restart: always
    environment:
      FS_DEFAULT_NAME: hdfs:\/\/namenode:9000
      DFS_REPLICATION: 3
      YARN_RESOURCEMANAGER_HOSTNAME: resourcemanager
      HISTORY_SERVER_HOST: historyserver
    command: namenode

  secondarynamenode:
    image: ashokkumarchoppadandi/apache-hadoop:2.7.6-stream9
    networks:
      - hadoop_cluster
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "50090:50090"
    hostname: secondarynamenode
    restart: always
    environment:
      FS_DEFAULT_NAME: hdfs:\/\/namenode:9000
      DFS_REPLICATION: 3
      YARN_RESOURCEMANAGER_HOSTNAME: resourcemanager
      HISTORY_SERVER_HOST: historyserver
    command: secondarynamenode

  resourcemanager:
    image: ashokkumarchoppadandi/apache-hadoop:2.7.6-stream9
    networks:
      - hadoop_cluster
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "8088:8088"
    hostname: resourcemanager
    restart: always
    environment:
      FS_DEFAULT_NAME: hdfs:\/\/namenode:9000
      DFS_REPLICATION: 3
      YARN_RESOURCEMANAGER_HOSTNAME: resourcemanager
      HISTORY_SERVER_HOST: historyserver
    command: resourcemanager

  historyserver:
    image: ashokkumarchoppadandi/apache-hadoop:2.7.6-stream9
    networks:
      - hadoop_cluster
    depends_on:
      namenode:
        condition: service_healthy
      resourcemanager:
        condition: service_healthy
    ports:
      - "19888:19888"
    hostname: historyserver
    restart: always
    environment:
      FS_DEFAULT_NAME: hdfs:\/\/namenode:9000
      DFS_REPLICATION: 3
      YARN_RESOURCEMANAGER_HOSTNAME: resourcemanager
      HISTORY_SERVER_HOST: historyserver
    command: historyserver

  slavenode1:
    image: ashokkumarchoppadandi/apache-hadoop:2.7.6-stream9
    networks:
      - hadoop_cluster
    depends_on:
      namenode:
        condition: service_healthy
      secondarynamenode:
        condition: service_healthy
      resourcemanager:
        condition: service_healthy
      historyserver:
        condition: service_healthy
    ports:
      - "18042:8042"
      - "15945:35945"
    hostname: slavenode1
    restart: always
    environment:
      FS_DEFAULT_NAME: hdfs:\/\/namenode:9000
      DFS_REPLICATION: 3
      YARN_RESOURCEMANAGER_HOSTNAME: resourcemanager
      HISTORY_SERVER_HOST: historyserver
    command: slavenode

  slavenode2:
    image: ashokkumarchoppadandi/apache-hadoop:2.7.6-stream9
    networks:
      - hadoop_cluster
    depends_on:
      namenode:
        condition: service_healthy
      secondarynamenode:
        condition: service_healthy
      resourcemanager:
        condition: service_healthy
      historyserver:
        condition: service_healthy
    ports:
      - "28042:18042"
      - "25945:35945"
    hostname: slavenode2
    restart: always
    environment:
      FS_DEFAULT_NAME: hdfs:\/\/namenode:9000
      DFS_REPLICATION: 3
      YARN_RESOURCEMANAGER_HOSTNAME: resourcemanager
      HISTORY_SERVER_HOST: historyserver
    command: slavenode

  slavenode3:
    image: ashokkumarchoppadandi/apache-hadoop:2.7.6-stream9
    networks:
      - hadoop_cluster
    depends_on:
      namenode:
        condition: service_healthy
      secondarynamenode:
        condition: service_healthy
      resourcemanager:
        condition: service_healthy
      historyserver:
        condition: service_healthy
    ports:
      - "38042:18042"
      - "35945:35945"
    hostname: slavenode3
    restart: always
    environment:
      FS_DEFAULT_NAME: hdfs:\/\/namenode:9000
      DFS_REPLICATION: 3
      YARN_RESOURCEMANAGER_HOSTNAME: resourcemanager
      HISTORY_SERVER_HOST: historyserver
    command: slavenode
